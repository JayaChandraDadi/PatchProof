[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchproof"
version = "0.1.0"
description = "An LLM code-review agent that only suggests fixes it has verified against your tests, linter and type checker."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jaya Chandra Dadi" }]
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]

[project.scripts]
patchproof = "patchproof.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
patchproof = ["bench/fixture/**/*", "bench/data/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["src/patchproof/bench/fixture"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "W293"]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["src/patchproof/bench/fixture/"]

[[tool.mypy.overrides]]
module = ["langgraph.*"]
ignore_missing_imports = true
