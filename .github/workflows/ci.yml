name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: mypy src
      - run: pytest -q -rfE 2>&1 | tee pytest-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Report failing tests as annotations
        if: failure()
        run: grep -E "^(FAILED|ERROR)" pytest-output.txt | sed 's/^/::error::/' || true

  pipeline-benchmark:
    # The scripted reviewers check the pipeline itself on all 140 PRs: anchoring,
    # verification, retries, and the hidden-test judge. No model or GPU needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: patchproof bench run --reviewer oracle-noisy --out ci-results
      - run: patchproof bench compare results/oracle-noisy/summary.json ci-results/oracle-noisy/summary.json
